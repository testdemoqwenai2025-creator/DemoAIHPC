<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#1a2133"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#logo)" stroke-width="3" opacity="0.2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#logo)" stroke-width="2" opacity="0.15"/>
  <!-- "A" logo letter -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="260" font-weight="900" fill="url(#logo)">A</text>
  <!-- Subtitle -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#9ca3af" letter-spacing="4">AIHPC</text>
</svg>
