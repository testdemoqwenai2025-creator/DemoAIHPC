name: Mirror to public on tag push

# Triggered on tag push (safer than every commit on main).
# Runs three pre-checks in sequence:
#   1. Gitleaks secret-scan (catches leaked tokens)
#   2. Application audit (Phase 26 / 27 — scripts/audit.py with 47 checks:
#      div balance, ribbon presence, subscribe-gate, math derivations,
#      JS syntax, .git/config clean, internal links, all 5 seed demos,
#      digest pattern, weekly digest in ribbon, generator scripts,
#      DAG provenance, TemporalGraph route, digest-parsers loaded,
#      ETL panels balanced, RSS subscribe panel)
#   3. Mirror push to the public DemoAIHPC repository (GitHub Pages source)
#
# The public mirror is at https://github.com/testdemoqwenai2025-creator/DemoAIHPC
# (this is the source that GitHub Pages serves).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks pre-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: configure with .gitleaks.toml in repo root.
          # Default config scans for common secret patterns (AWS keys,
          # GitHub PATs, Stripe keys, etc.) and any *.env / *.key files.

  application-audit:
    name: Application audit (47 checks)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js (for JS syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run audit script
        run: |
          # Pre-mirror audit: skip the live_public_endpoints check because
          # the public mirror hasn't been updated yet (the live probe can
          # only pass AFTER this CI run completes the mirror push).
          # The post-mirror verification job (below) runs the live check
          # after the Pages build has time to propagate.
          python3 scripts/audit.py --json --skip-live-check > audit-results.json
          echo "## Application audit results (pre-mirror, live-check deferred)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 scripts/audit.py --skip-live-check >> $GITHUB_STEP_SUMMARY 2>&1
          # Exit with audit.py's exit code (0 = pass, 1 = any failure)
          python3 scripts/audit.py --skip-live-check > /dev/null 2>&1

      - name: Generate audit dashboard (Phase 31 — auto-updating)
        if: always()
        run: |
          python3 scripts/gen-audit-dashboard.py
          # The dashboard + history JSONs are now updated in docs/
          # They'll be included in the mirror push below

      - name: Upload audit results as artifact
        if: always()
        continue-on-error: true  # don't fail the job if Actions storage quota is hit
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            audit-results.json
            docs/audit.html
            docs/audit-history/
          retention-days: 30

  mirror-to-public:
    name: Mirror to DemoAIHPC (public)
    needs: [secret-scan, application-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror push to public repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Phase 31: regenerate audit dashboard before mirror so it's
          # always up-to-date on the public site
          python3 scripts/gen-audit-dashboard.py || true
          # Phase 33: regenerate concept cards from the latest digest manifest
          python3 scripts/gen-concept-cards.py || true
          # Phase 35: regenerate ML concept cards from the ML page manifest
          python3 scripts/gen-ml-concept-cards.py || true
          # Stage the updated dashboard + history + concept cards for the mirror
          git add docs/audit.html docs/audit-history/ docs/concepts/ 2>/dev/null || true
          git commit -m "CI: auto-update audit dashboard" 2>/dev/null || true
          git remote add public "https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/testdemoqwenai2025-creator/DemoAIHPC.git"
          git push --force-with-lease public "refs/tags/${GITHUB_REF##*/}:refs/tags/${GITHUB_REF##*/}"
          git push --force-with-lease public HEAD:main

      - name: Trigger GitHub Pages rebuild
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.MIRROR_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/testdemoqwenai2025-creator/DemoAIHPC/pages/builds"

      - name: Summary
        run: |
          echo "Mirror pushed to DemoAIHPC at tag ${GITHUB_REF##*/}."
          echo "Public preview will rebuild at https://testdemoqwenai2025-creator.github.io/DemoAIHPC/"

  post-mirror-verify:
    name: Post-mirror live endpoint verification
    needs: [mirror-to-public]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for GitHub Pages rebuild (60s)
        run: sleep 60

      - name: Probe live public endpoints
        # Run only the live_public_endpoints check, retrying up to 3 times
        # with 60s back-off. Pages builds can take 1-3 minutes to propagate.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Live endpoint probe (attempt $attempt of 3)"
            if python3 scripts/audit.py --live-only; then
              echo "::endgroup::"
              echo "✓ All platform pages serve 200 on the public mirror"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed — waiting 60s before retry..."
              sleep 60
            fi
          done
          echo "::error::Live endpoint verification failed after 3 attempts"
          echo "::notice::The mirror push itself succeeded, but some pages"
          echo "::notice::are still returning 404 on the public site. Check"
          echo "::notice::https://testdemoqwenai2025-creator.github.io/DemoAIHPC/"
          echo "::notice::manually and re-trigger if needed."
          exit 1
