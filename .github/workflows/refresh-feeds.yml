name: Refresh journal RSS feeds

# Phase 51: Continuous journal-RSS ingestion pipeline.
# Runs every 6 hours, fetches each feed in scripts/feeds/registry.json,
# normalises the entries into a single JSON array, and commits the
# snapshot to docs/feeds/all.json + per-domain JSON files.
#
# The client-side docs/feeds.html page then fetches the JSON on page
# load and renders a unified timeline. No backend, no API keys — the
# platform's pure-client-side design principle is preserved.
#
# Skip conditions:
#  * If the script fails entirely (network down, parser bug), the
#    workflow still succeeds so historical snapshots remain intact.
#  * If no feed has changed since the last snapshot, the commit step
#    is skipped (no-op commit).
#
# Audit: scripts/audit.py check_feeds_fresh verifies that
# docs/feeds/all.json exists and is < 12 hours old. Stale feeds
# will block the next tag push (visible signal in CI).

on:
  schedule:
    # Every 6 hours at minute 0 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-feeds:
    name: Refresh RSS feeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh feeds
        run: |
          python3 scripts/refresh-feeds.py
        continue-on-error: true  # don't fail the workflow if a feed is temporarily unreachable

      - name: Commit + push if feeds changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feeds/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No feed changes since last refresh — skipping commit."
          else
            git commit -m "CI: refresh journal RSS feeds ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
